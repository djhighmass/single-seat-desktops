# Used only until the installer has written ~/.config/wayfire.ini: just
# enough to get a terminal on screen so you can run the installer from
# inside the session. wf-shell (panel/background) autostarts by default.
[core]
plugins = autostart wayfire-shell foreign-toplevel resize move grid wobbly decoration place

[autostart]
welcome = foot bash -c 'cat /usr/local/lib/dev-session/motd; exec bash'

[move]
activate = <alt> BTN_LEFT

[resize]
activate = <alt> BTN_RIGHT
